<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry, kuchupuchu 🌸</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Playfair+Display:ital@1&family=Caveat:wght@600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg1: #ffe4ec;
    --bg2: #ffd1dc;
    --bg3: #ffc2d6;
    --card: rgba(255,255,255,0.85);
    --card-border: rgba(255,255,255,0.6);
    --text-main: #8a4a63;
    --text-accent: #c9497a;
    --text-sub: #b56487;
    --pill: linear-gradient(135deg, #ff8fb3, #ff6b9d);
    --note-bg: linear-gradient(135deg, #fff5f8, #ffeaf1);
    --note-border: #ffd6e3;
  }

  body.dark {
    --bg1: #241726;
    --bg2: #2e1b34;
    --bg3: #3a1f42;
    --card: rgba(40, 24, 46, 0.85);
    --card-border: rgba(255,255,255,0.08);
    --text-main: #eec7da;
    --text-accent: #ff9ec4;
    --text-sub: #d9a8c0;
    --pill: linear-gradient(135deg, #ff6b9d, #c9497a);
    --note-bg: linear-gradient(135deg, #331f39, #3a1f42);
    --note-border: #4a2a4f;
  }

  html {
    height: -webkit-fill-available;
  }

  body {
    min-height: 100vh;
    min-height: -webkit-fill-available;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 40%, var(--bg3) 100%);
    overflow: hidden;
    position: relative;
    transition: background 0.5s ease;
    -webkit-text-size-adjust: 100%;
  }

  .floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .floater { position: absolute; bottom: -60px; font-size: 28px; opacity: 0.75; animation: rise linear infinite; }
  @keyframes rise {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; } 90% { opacity: 0.8; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .controls {
    position: fixed;
    top: 18px;
    z-index: 5;
    display: flex;
    gap: 10px;
  }
  .controls.left { left: 18px; }
  .controls.right { right: 18px; }

  .icon-btn {
    background: var(--card);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    width: 40px;
    height: 40px;
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(255,105,150,0.2);
    transition: transform 0.2s ease;
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover { transform: scale(1.08); }

  .scene {
    position: relative;
    z-index: 1;
    width: 90%;
    max-width: 460px;
    -webkit-perspective: 1600px;
    perspective: 1600px;
  }

  .card-inner {
    position: relative;
    width: 100%;
    min-height: 480px;
    -webkit-transform-style: preserve-3d;
    transform-style: preserve-3d;
    -webkit-transition: -webkit-transform 1s cubic-bezier(.2,.9,.3,1);
    transition: transform 1s cubic-bezier(.2,.9,.3,1);
  }
  .card-inner.flipped { -webkit-transform: rotateY(180deg); transform: rotateY(180deg); }

  .face {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    background: var(--card);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-radius: 28px;
    padding: 40px 32px;
    box-shadow: 0 20px 60px rgba(255,105,150,0.25), 0 2px 8px rgba(0,0,0,0.04);
    border: 1px solid var(--card-border);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-transform: translateZ(0);
  }

  .front { animation: pop 0.7s cubic-bezier(.2,1.4,.4,1) both; }
  .back {
    -webkit-transform: rotateY(180deg);
    transform: rotateY(180deg);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    text-align: left;
    justify-content: flex-start;
  }

  @keyframes pop {
    0% { transform: scale(0.85) translateY(20px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 28px;
    color: var(--text-accent);
    margin: 4px 0 6px;
  }

  .sub { color: var(--text-sub); font-size: 13.5px; margin-bottom: 20px; letter-spacing: 0.3px; }

  /* Cat scene */
  .cat-box { margin: 8px 0 18px; }
  .cat {
    width: 100px;
    height: 90px;
    position: relative;
    margin: 0 auto;
  }
  .cat-face {
    width: 78px; height: 68px;
    background: #ffd7a8;
    border-radius: 50% 50% 46% 46%;
    position: absolute;
    left: 11px; top: 18px;
  }
  body.dark .cat-face { background: #e6b285; }
  .ear {
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-bottom: 22px solid #ffd7a8;
    position: absolute; top: 2px;
  }
  body.dark .ear { border-bottom-color: #e6b285; }
  .ear.l { left: 12px; transform: rotate(-18deg); }
  .ear.r { right: 12px; transform: rotate(18deg); }
  .eye {
    width: 8px; height: 8px;
    background: #4a3226;
    border-radius: 50%;
    position: absolute; top: 44px;
    animation: blink 4s ease-in-out infinite;
  }
  .eye.l { left: 30px; } .eye.r { left: 60px; }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }
  .nose {
    width: 6px; height: 5px;
    background: #ff9eb5;
    border-radius: 50%;
    position: absolute; top: 56px; left: 47px;
  }
  .tail {
    width: 8px; height: 46px;
    background: #ffd7a8;
    border-radius: 6px;
    position: absolute; bottom: 0; right: -2px;
    transform-origin: bottom center;
    animation: swish 2.2s ease-in-out infinite;
  }
  body.dark .tail { background: #e6b285; }
  @keyframes swish {
    0%, 100% { transform: rotate(10deg); }
    50% { transform: rotate(-14deg); }
  }

  .emoji-row {
    font-size: 24px;
    margin: 6px 0 22px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .emoji-row span { display: inline-block; animation: bob 2.2s ease-in-out infinite; }
  .emoji-row span:nth-child(2) { animation-delay: 0.2s; }
  .emoji-row span:nth-child(3) { animation-delay: 0.4s; }
  .emoji-row span:nth-child(4) { animation-delay: 0.6s; }
  .emoji-row span:nth-child(5) { animation-delay: 0.8s; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  .hint { font-size: 12px; color: var(--text-sub); margin-top: 4px; }

  button.pill {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    color: #fff;
    background: var(--pill);
    border: none;
    padding: 13px 30px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,107,157,0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    margin-top: 6px;
  }
  button.pill:hover { transform: translateY(-2px) scale(1.03); }
  button.pill:active { transform: translateY(0) scale(0.98); }

  /* Back face content */
  .badge-small { font-size: 30px; text-align: center; width: 100%; margin-bottom: 4px; }
  .back h2 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--text-accent);
    font-size: 22px;
    text-align: center;
    margin-bottom: 4px;
  }

  .meter-wrap { margin: 14px 0 20px; }
  .meter-label {
    display: flex; justify-content: space-between;
    font-size: 11.5px; color: var(--text-sub);
    margin-bottom: 5px; font-weight: 600; letter-spacing: 0.3px;
  }
  .meter-track {
    width: 100%; height: 10px;
    background: var(--note-bg);
    border: 1px solid var(--note-border);
    border-radius: 999px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    width: 0%;
    background: var(--pill);
    border-radius: 999px;
    transition: width 2.2s cubic-bezier(.2,.8,.3,1);
  }

  .section {
    background: var(--note-bg);
    border: 1px solid var(--note-border);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .section h3 {
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-accent);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .section p {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-main);
    min-height: 1.6em;
  }
  .cursor {
    display: inline-block;
    width: 2px;
    background: var(--text-accent);
    margin-left: 1px;
    animation: caret 0.8s steps(1) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }

  .signature {
    font-family: 'Caveat', cursive;
    font-weight: 600;
    color: var(--text-accent);
    font-size: 22px;
    text-align: right;
    margin-top: 6px;
  }

  .footer-note { margin-top: 8px; font-size: 11px; color: var(--text-sub); text-align: center; letter-spacing: 0.4px; }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    top: -10px;
    z-index: 10;
    border-radius: 2px;
    pointer-events: none;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0.9; }
  }
</style>
</head>
<body>

<div class="floaters" id="floaters"></div>

<div class="controls left">
  <button class="icon-btn" id="musicBtn" title="toggle music">🔇</button>
</div>
<div class="controls right">
  <button class="icon-btn" id="themeBtn" title="toggle theme">🌙</button>
</div>

<div class="scene">
  <div class="card-inner" id="cardInner">

    <!-- FRONT -->
    <div class="face front">
      <h1>Hey Hania...</h1>
      <p class="sub">I made this instead of just saying it in text</p>

      <div class="cat-box">
        <div class="cat">
          <div class="ear l"></div>
          <div class="ear r"></div>
          <div class="cat-face"></div>
          <div class="eye l"></div>
          <div class="eye r"></div>
          <div class="nose"></div>
          <div class="tail"></div>
        </div>
      </div>

      <div class="emoji-row">
        <span>🐱</span><span>🍰</span><span>🐾</span><span>🍓</span><span>🧁</span>
      </div>

      <button class="pill" id="flipBtn">turn the page 🎀</button>
      <div class="hint">(or just wait a few seconds)</div>
    </div>

    <!-- BACK -->
    <div class="face back">
      <div class="badge-small">🌸</div>
      <h2>okay, here goes</h2>

      <div class="meter-wrap">
        <div class="meter-label"><span>sorry meter </span><span id="meterPct">0%</span></div>
        <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
      </div>

      <div class="section">
        <h3>why I'm sorry</h3>
        <p id="type1"><span class="cursor">&nbsp;</span></p>
      </div>

      <div class="section">
        <h3>what I'll do differently</h3>
        <p id="type2"><span class="cursor">&nbsp;</span></p>
      </div>

      <div class="signature">— Azaan 🐾</div>
      <div class="footer-note">made with sadness (and a little bit of panic)</div>
    </div>

  </div>
</div>

<script>
  // floating background emojis
  const emojis = ['🐱','🍓','🧁','🐾','🍰','🎀','🐈'];
  const container = document.getElementById('floaters');
  for (let i = 0; i < 16; i++) {
    const el = document.createElement('div');
    el.className = 'floater';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (10 + Math.random() * 10) + 's';
    el.style.animationDelay = (Math.random() * 10) + 's';
    el.style.fontSize = (20 + Math.random() * 16) + 'px';
    container.appendChild(el);
  }

  // ---- Web Audio: chime + soft ambient loop (no external files) ----
  let actx = null;
  function getCtx() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    } catch (e) {
      return null;
    }
  }

  function playChime() {
    const ctx = getCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + i * 0.09);
      gain.gain.linearRampToValueAtTime(0.12, now + i * 0.09 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.9);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * 0.09);
      osc.stop(now + i * 0.09 + 1);
    });
  }

  let musicOn = false;
  let musicNodes = [];
  function startMusic() {
    const ctx = getCtx();
    if (!ctx) return;
    const master = ctx.createGain();
    master.gain.value = 0.05;
    master.connect(ctx.destination);
    const notes = [261.63, 329.63, 392.00, 440.00];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.value = 0.08 + i * 0.02;
      lfoGain.gain.value = 0.03;
      lfo.connect(lfoGain);
      const gain = ctx.createGain();
      lfoGain.connect(gain.gain);
      gain.gain.value = 0.04;
      osc.frequency.value = freq;
      osc.connect(gain).connect(master);
      osc.start();
      lfo.start();
      musicNodes.push(osc, lfo, master);
    });
  }
  function stopMusic() {
    musicNodes.forEach(n => { try { n.stop && n.stop(); n.disconnect && n.disconnect(); } catch(e){} });
    musicNodes = [];
  }

  document.getElementById('musicBtn').addEventListener('click', function() {
    musicOn = !musicOn;
    this.textContent = musicOn ? '🔊' : '🔇';
    if (musicOn) { startMusic(); }
    else { stopMusic(); }
  });

  // theme toggle
  document.getElementById('themeBtn').addEventListener('click', function() {
    document.body.classList.toggle('dark');
    this.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  });

  // confetti
  function burstConfetti() {
    const colors = ['#ff8fb3', '#ff6b9d', '#ffd166', '#c9497a', '#ffe4ec'];
    for (let i = 0; i < 60; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const size = 6 + Math.random() * 6;
      piece.style.width = size + 'px';
      piece.style.height = (size * 0.4) + 'px';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 4200);
    }
  }

  // typing animation
  function typeText(elId, text, speed, onDone) {
    const el = document.getElementById(elId);
    const cursor = el.querySelector('.cursor');
    let i = 0;
    (function step() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        el.appendChild(cursor);
        i++;
        setTimeout(step, speed);
      } else if (onDone) onDone();
    })();
  }

  const msg1 = "I know things have felt off between us lately, and it's because of something I did. No excuses \u2014 I'm genuinely sorry, and I don't like that you want to put distance between us when there didn't need to be any, I hope you take your decision back and forgive me.";
  const msg2 = "I'm going to be more thoughtful before I act, and more honest with you when something's on my mind instead of letting it turn into this. You matter too much for me to be careless with it.";

  let flipped = false;
  function doFlip() {
    if (flipped) return;
    flipped = true;
    document.getElementById('cardInner').classList.add('flipped');
    playChime();
    setTimeout(() => {
      burstConfetti();
      const fill = document.getElementById('meterFill');
      const pct = document.getElementById('meterPct');
      fill.style.width = '100%';
      let p = 0;
      const iv = setInterval(() => {
        p += 4;
        if (p >= 100) { p = 100; clearInterval(iv); }
        pct.textContent = p + '%';
      }, 88);

      typeText('type1', msg1, 22, () => {
        setTimeout(() => typeText('type2', msg2, 22), 300);
      });
    }, 600);
  }

  document.getElementById('flipBtn').addEventListener('click', doFlip);
  setTimeout(doFlip, 5000); // auto-flip so it never feels gated
</script>

</body>
</html>
