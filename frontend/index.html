<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>I'm Sorry, Hania</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,400;1,500&family=Caveat:wght@600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg1: #f5e6d3;
    --bg2: #e2c3a0;
    --bg3: #c79a6b;
    --card: rgba(255, 248, 238, 0.78);
    --card-border: rgba(255, 255, 255, 0.65);
    --text-main: #5a3a26;
    --text-accent: #8b4a1f;
    --text-sub: #9a6c4a;
    --pill: linear-gradient(135deg, #c98a4b, #8b4a1f);
    --note-bg: linear-gradient(135deg, rgba(255,244,230,.9), rgba(240,218,190,.85));
    --note-border: #e2c3a0;
    --glow: rgba(201, 138, 75, 0.35);
    --shadow: rgba(90, 50, 20, 0.35);
    --fur: #d9a066;
    --fur-dark: #b9783f;
    --particle: 139, 74, 31;
  }

  body.dark {
    --bg1: #1a0f0a;
    --bg2: #2b1912;
    --bg3: #3e2619;
    --card: rgba(46, 28, 20, 0.78);
    --card-border: rgba(255, 220, 180, 0.12);
    --text-main: #f0d9bf;
    --text-accent: #e8a867;
    --text-sub: #bf9370;
    --pill: linear-gradient(135deg, #e8a867, #a8602a);
    --note-bg: linear-gradient(135deg, rgba(62,38,25,.9), rgba(46,28,20,.9));
    --note-border: #5a3a26;
    --glow: rgba(232, 168, 103, 0.28);
    --shadow: rgba(0, 0, 0, 0.6);
    --fur: #c98a4b;
    --fur-dark: #8f5a2c;
    --particle: 232, 168, 103;
  }

  html { height: -webkit-fill-available; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    background-size: 200% 200%;
    animation: bgshift 18s ease-in-out infinite;
    overflow: hidden;
    position: relative;
    transition: background-color .6s ease;
    -webkit-text-size-adjust: 100%;
  }
  @keyframes bgshift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* film grain */
  body::after {
    content: "";
    position: fixed; inset: -50%;
    z-index: 2;
    pointer-events: none;
    opacity: .09;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1.2s steps(6) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0,0); } 20% { transform: translate(-3%,2%); }
    40% { transform: translate(2%,-3%); } 60% { transform: translate(-2%,-1%); }
    80% { transform: translate(3%,3%); } 100% { transform: translate(0,0); }
  }

  /* vignette */
  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(40,18,6,.35) 100%);
  }

  #fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  /* cursor glow */
  .cursor-glow {
    position: fixed; z-index: 1; pointer-events: none;
    width: 420px; height: 420px; border-radius: 50%;
    left: 0; top: 0;
    background: radial-gradient(circle, var(--glow), transparent 65%);
    transform: translate(-50%, -50%);
    transition: opacity .4s ease;
    opacity: 0;
    mix-blend-mode: soft-light;
  }

  .controls { position: fixed; top: 18px; z-index: 6; display: flex; gap: 10px; }
  .controls.left { left: 18px; } .controls.right { right: 18px; }
  .icon-btn {
    background: var(--card);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--card-border);
    border-radius: 999px; width: 42px; height: 42px; font-size: 17px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px var(--shadow);
    transition: transform .25s ease;
    -webkit-appearance: none; -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover { transform: scale(1.1) rotate(8deg); }

  /* ---------- scene ---------- */
  .scene {
    position: relative; z-index: 3;
    width: 90%; max-width: 470px;
    perspective: 1600px; -webkit-perspective: 1600px;
    max-height: 100dvh;
  }
  .tilt {
    transform-style: preserve-3d;
    transition: transform .25s ease-out;
    will-change: transform;
  }
  .card-inner {
    position: relative; width: 100%; height: min(700px, 92dvh);
    transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(.2,.9,.25,1);
  }
  .card-inner.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--card);
    -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
    border-radius: 30px;
    padding: 38px 30px;
    box-shadow: 0 30px 80px var(--shadow), 0 2px 10px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.4);
    border: 1px solid var(--card-border);
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
    transform: translateZ(0);
  }
  /* spotlight sheen following pointer */
  .face::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 0%), rgba(255,235,205,.28), transparent 45%);
    opacity: .9;
  }
  /* animated border shimmer */
  .face::after {
    content: ""; position: absolute; inset: 0; border-radius: 30px; padding: 1px; pointer-events: none;
    background: conic-gradient(from var(--ang, 0deg), transparent 0 70%, rgba(255,214,160,.9) 85%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spin 5s linear infinite;
  }
  @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes spin { to { --ang: 360deg; } }

  .front { animation: pop .9s cubic-bezier(.2,1.4,.4,1) both; justify-content: center; }
  .back {
    transform: rotateY(180deg);
    justify-content: flex-start;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  @keyframes pop {
    0% { transform: scale(.85) translateY(30px); opacity: 0; filter: blur(8px); }
    100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); }
  }

  h1 {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500;
    font-size: 34px; color: var(--text-accent); margin: 4px 0 8px;
    background: linear-gradient(90deg, var(--text-accent), #e8b27a, var(--text-accent));
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }

  .sub { color: var(--text-sub); font-size: 14px; margin-bottom: 18px; letter-spacing: .3px; }

  /* ---------- cat ---------- */
  .cat-box { margin: 6px 0 14px; position: relative; }
  .cat-box::after {
    content: ""; position: absolute; left: 50%; bottom: -8px; width: 90px; height: 12px;
    transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,.28), transparent 70%);
    animation: shadowpulse 3s ease-in-out infinite;
  }
  @keyframes shadowpulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(.85); } }
  .cat { width: 110px; height: 100px; position: relative; margin: 0 auto; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .cat-face {
    width: 86px; height: 74px; border-radius: 50% 50% 46% 46%;
    background: radial-gradient(circle at 35% 30%, #efc08a, var(--fur) 60%, var(--fur-dark));
    position: absolute; left: 12px; top: 20px;
    box-shadow: 0 8px 18px rgba(80,40,10,.3);
  }
  .ear {
    width: 0; height: 0; position: absolute; top: 2px;
    border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-bottom: 26px solid var(--fur);
    animation: twitch 5s ease-in-out infinite;
  }
  .ear.l { left: 12px; transform: rotate(-18deg); transform-origin: bottom; }
  .ear.r { right: 12px; transform: rotate(18deg); transform-origin: bottom; animation-delay: 2s; }
  @keyframes twitch { 0%,90%,100% { translate: 0 0; } 94% { translate: 0 -3px; } 97% { translate: 0 0; } }
  .eyes { position: absolute; top: 46px; left: 0; width: 100%; }
  .eye {
    width: 10px; height: 12px; background: #2c1a10; border-radius: 50%;
    position: absolute; top: 0;
    animation: blink 4.5s ease-in-out infinite;
  }
  .eye::after { content: ""; position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%; top: 2px; left: 2px; }
  .eye.l { left: 36px; } .eye.r { left: 66px; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .nose { width: 8px; height: 6px; background: #8b4a3a; border-radius: 50% 50% 60% 60%; position: absolute; top: 62px; left: 51px; }
  .blush { width: 12px; height: 7px; border-radius: 50%; background: rgba(176,90,60,.35); position: absolute; top: 62px; }
  .blush.l { left: 24px; } .blush.r { left: 74px; }
  .whisk { position: absolute; top: 64px; width: 16px; height: 2px; background: rgba(60,30,12,.45); border-radius: 2px; }
  .whisk.l1 { left: 18px; transform: rotate(8deg); } .whisk.l2 { left: 18px; top: 69px; transform: rotate(-8deg); }
  .whisk.r1 { right: 16px; transform: rotate(-8deg); } .whisk.r2 { right: 16px; top: 69px; transform: rotate(8deg); }
  .tail {
    width: 10px; height: 50px; background: var(--fur-dark); border-radius: 8px;
    position: absolute; bottom: 0; right: -4px; transform-origin: bottom center;
    animation: swish 2.4s ease-in-out infinite;
  }
  @keyframes swish { 0%,100% { transform: rotate(14deg); } 50% { transform: rotate(-16deg); } }

  .emoji-row { font-size: 24px; margin: 16px 0 22px; display: flex; justify-content: center; gap: 12px; }
  .emoji-row span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .emoji-row span:nth-child(2) { animation-delay: .2s; } .emoji-row span:nth-child(3) { animation-delay: .4s; }
  .emoji-row span:nth-child(4) { animation-delay: .6s; } .emoji-row span:nth-child(5) { animation-delay: .8s; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  .hint { font-size: 12px; color: var(--text-sub); margin-top: 10px; }

  button.pill {
    position: relative; overflow: hidden;
    font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 15px; color: #fff8ee;
    background: var(--pill); border: none; padding: 14px 32px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 10px 26px rgba(120,60,20,.45);
    transition: transform .2s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
    animation: pulse 2.4s ease-in-out infinite;
  }
  button.pill::after {
    content: ""; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    transform: skewX(-20deg); animation: sweep 3s ease-in-out infinite;
  }
  @keyframes sweep { 0% { left: -80%; } 60%, 100% { left: 140%; } }
  @keyframes pulse { 0%,100% { box-shadow: 0 10px 26px rgba(120,60,20,.45), 0 0 0 0 rgba(201,138,75,.5); } 50% { box-shadow: 0 10px 26px rgba(120,60,20,.45), 0 0 0 12px rgba(201,138,75,0); } }
  button.pill:hover { transform: translateY(-2px) scale(1.04); }
  button.pill:active { transform: scale(.97); }

  /* ---------- back ---------- */
  .badge-small { font-size: 32px; width: 100%; text-align: center; animation: heartbeat 1.6s ease-in-out infinite; }
  @keyframes heartbeat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
  .back h2 {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500;
    color: var(--text-accent); font-size: 24px; text-align: center; margin: 4px 0 2px;
  }

  .meter-wrap { width: 100%; margin: 14px 0 18px; }
  .meter-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-sub); margin-bottom: 6px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; }
  .meter-track { width: 100%; height: 11px; background: var(--note-bg); border: 1px solid var(--note-border); border-radius: 999px; overflow: hidden; }
  .meter-fill {
    height: 100%; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, #a8602a, #e8a867, #a8602a); background-size: 200% 100%;
    transition: width 2.4s cubic-bezier(.2,.8,.3,1);
    animation: flow 2s linear infinite;
  }
  @keyframes flow { to { background-position: 200% 0; } }

  .section {
    width: 100%; text-align: left;
    background: var(--note-bg); border: 1px solid var(--note-border);
    border-radius: 18px; padding: 20px 20px;
    position: relative;
  }
  .section::before {
    content: "\201C"; position: absolute; top: -6px; left: 12px;
    font-family: 'Playfair Display', serif; font-size: 62px; line-height: 1; color: var(--text-accent); opacity: .35;
  }
  .section + .section { margin-top: 12px; }
  .section.second::before { content: ""; }
  .section.second p { min-height: 8em; }
  .section p { font-size: 16px; line-height: 1.75; color: var(--text-main); min-height: 6.5em; position: relative; }
  .section p .hl {
    color: var(--text-accent); font-weight: 700;
    background: linear-gradient(transparent 62%, rgba(232,168,103,.45) 62%);
  }
  .cursor { display: inline-block; width: 2px; height: 1em; vertical-align: text-bottom; background: var(--text-accent); margin-left: 1px; animation: caret .8s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }

  .signature {
    font-family: 'Caveat', cursive; font-weight: 600; color: var(--text-accent);
    font-size: 26px; text-align: right; width: 100%; margin-top: 12px;
    opacity: 0; transform: translateY(8px); transition: opacity 1s ease, transform 1s ease;
  }
  .signature.show { opacity: 1; transform: none; }

  .again {
    margin-top: 12px; align-self: center; font-family: 'Quicksand', sans-serif; font-size: 12.5px; font-weight: 700;
    color: var(--text-sub); background: none; border: 1px solid var(--note-border); padding: 8px 16px; border-radius: 999px; cursor: pointer;
    opacity: 0; transition: opacity 1s ease, background .2s ease;
  }
  .again.show { opacity: 1; }
  .again:hover { background: var(--note-bg); }

  /* confetti + hearts */
  .confetti-piece { position: fixed; top: -14px; z-index: 10; border-radius: 2px; pointer-events: none; animation: confetti-fall linear forwards; }
  @keyframes confetti-fall {
    0% { transform: translateY(0) translateX(0) rotate(0); opacity: 1; }
    100% { transform: translateY(105vh) translateX(var(--dx, 0)) rotate(900deg); opacity: .85; }
  }
  .tap-heart { position: fixed; z-index: 9; pointer-events: none; font-size: 20px; animation: heartup 1.4s ease-out forwards; }
  @keyframes heartup {
    0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
    100% { transform: translate(-50%, -140px) scale(1.4); opacity: 0; }
  }

  @media (max-width: 420px) {
    .face { padding: 30px 22px; }
    h1 { font-size: 30px; }
    .card-inner { height: min(780px, 92dvh); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div class="vignette"></div>
<div class="cursor-glow" id="glow"></div>

<div class="controls left"><button class="icon-btn" id="musicBtn" title="toggle music">🔇</button></div>
<div class="controls right"><button class="icon-btn" id="themeBtn" title="toggle theme">🌙</button></div>

<div class="scene" id="scene">
  <div class="tilt" id="tilt">
    <div class="card-inner" id="cardInner">

      <!-- FRONT -->
      <div class="face front">
        <h1>Hey Hania...</h1>
        <p class="sub">I made this instead of just saying it in text</p>

        <div class="cat-box">
          <div class="cat">
            <div class="ear l"></div><div class="ear r"></div>
            <div class="cat-face"></div>
            <div class="eyes"><div class="eye l"></div><div class="eye r"></div></div>
            <div class="blush l"></div><div class="blush r"></div>
            <div class="nose"></div>
            <div class="whisk l1"></div><div class="whisk l2"></div><div class="whisk r1"></div><div class="whisk r2"></div>
            <div class="tail"></div>
          </div>
        </div>

        <div class="emoji-row"><span>🐱</span><span>☕</span><span>🐾</span><span>🍫</span><span>🧸</span></div>

        <button class="pill" id="flipBtn">turn the page 🤎</button>
        <div class="hint">(or just wait a few seconds)</div>
      </div>

      <!-- BACK -->
      <div class="face back">
        <div class="badge-small">🤎</div>
        <h2>okay, here goes</h2>

        <div class="meter-wrap">
          <div class="meter-label"><span>sorry meter</span><span id="meterPct">0%</span></div>
          <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
        </div>

        <div class="section">
          <p id="type1"><span class="cursor"></span></p>
        </div>

        <div class="section second">
          <p id="type2"></p>
        </div>

        <div class="signature" id="sig">— Azaan 🐾</div>
        <button class="again" id="againBtn">read it again</button>
      </div>

    </div>
  </div>
</div>

<script>
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- particle canvas: drifting embers / coffee dust ---------- */
  const cv = document.getElementById('fx');
  const cx = cv.getContext('2d');
  let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
  const mouse = { x: -999, y: -999 };
  function resize() {
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize(); addEventListener('resize', resize);

  const glyphs = ['🤎', '☕', '🍂', '🐾', '🍫', '✦'];
  const parts = [];
  const N = reduce ? 0 : (innerWidth < 600 ? 34 : 70);
  function spawn(p, initial) {
    p.x = Math.random() * W;
    p.y = initial ? Math.random() * H : H + 30;
    p.r = 1 + Math.random() * 3;
    p.vy = -(0.2 + Math.random() * 0.7);
    p.vx = (Math.random() - .5) * 0.3;
    p.a = 0.15 + Math.random() * 0.5;
    p.ph = Math.random() * 6.28;
    p.glyph = Math.random() < 0.14 ? glyphs[Math.floor(Math.random() * glyphs.length)] : null;
    p.gs = 14 + Math.random() * 14;
    p.rot = Math.random() * 6.28;
    p.vr = (Math.random() - .5) * 0.02;
    return p;
  }
  for (let i = 0; i < N; i++) parts.push(spawn({}, true));

  function frame(t) {
    cx.clearRect(0, 0, W, H);
    const rgb = getComputedStyle(document.body).getPropertyValue('--particle').trim() || '139,74,31';
    for (const p of parts) {
      p.ph += 0.01;
      p.x += p.vx + Math.sin(p.ph) * 0.35;
      p.y += p.vy;
      p.rot += p.vr;
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < 14000) { const f = (1 - d2 / 14000) * 2.2; const d = Math.sqrt(d2) || 1; p.x += dx / d * f; p.y += dy / d * f; }
      if (p.y < -40 || p.x < -40 || p.x > W + 40) spawn(p, false);
      if (p.glyph) {
        cx.save(); cx.globalAlpha = p.a * 0.9; cx.translate(p.x, p.y); cx.rotate(p.rot);
        cx.font = p.gs + 'px serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
        cx.fillText(p.glyph, 0, 0); cx.restore();
      } else {
        const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
        g.addColorStop(0, `rgba(${rgb},${p.a})`); g.addColorStop(1, `rgba(${rgb},0)`);
        cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, p.r * 4, 0, 6.283); cx.fill();
      }
    }
    requestAnimationFrame(frame);
  }
  if (!reduce) requestAnimationFrame(frame);

  /* ---------- pointer: glow, 3D tilt, sheen, cat eyes ---------- */
  const glow = document.getElementById('glow');
  const tilt = document.getElementById('tilt');
  const scene = document.getElementById('scene');
  const eyes = document.querySelectorAll('.eye');
  function onMove(x, y) {
    mouse.x = x; mouse.y = y;
    glow.style.opacity = 1; glow.style.left = x + 'px'; glow.style.top = y + 'px';
    const r = scene.getBoundingClientRect();
    const px = (x - r.left) / r.width, py = (y - r.top) / r.height;
    const cxn = Math.max(-1, Math.min(1, (px - .5) * 2)), cyn = Math.max(-1, Math.min(1, (py - .5) * 2));
    if (!reduce) tilt.style.transform = `rotateY(${cxn * 7}deg) rotateX(${-cyn * 7}deg)`;
    document.querySelectorAll('.face').forEach(f => {
      f.style.setProperty('--mx', (px * 100) + '%'); f.style.setProperty('--my', (py * 100) + '%');
    });
    eyes.forEach(e => e.style.translate = `${cxn * 2}px ${cyn * 2}px`);
  }
  addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
  addEventListener('pointerleave', () => { glow.style.opacity = 0; tilt.style.transform = ''; mouse.x = mouse.y = -999; });

  /* tap hearts anywhere */
  addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    const h = document.createElement('div');
    h.className = 'tap-heart'; h.textContent = ['🤎', '🍂', '✨'][Math.floor(Math.random() * 3)];
    h.style.left = e.clientX + 'px'; h.style.top = e.clientY + 'px';
    document.body.appendChild(h); setTimeout(() => h.remove(), 1500);
  });

  /* ---------- Web Audio: chime + warm ambient pad ---------- */
  let actx = null;
  function getCtx() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function playChime() {
    const ctx = getCtx(); if (!ctx) return;
    const now = ctx.currentTime;
    [392.00, 493.88, 587.33, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'triangle'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + i * .1);
      gain.gain.linearRampToValueAtTime(.1, now + i * .1 + .03);
      gain.gain.exponentialRampToValueAtTime(.001, now + i * .1 + 1.2);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * .1); osc.stop(now + i * .1 + 1.3);
    });
  }
  let musicOn = false, musicNodes = [], masterGain = null;
  function startMusic() {
    const ctx = getCtx(); if (!ctx) return;
    masterGain = ctx.createGain(); masterGain.gain.value = 0.0001;
    masterGain.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + 2);
    masterGain.connect(ctx.destination);
    [196.00, 246.94, 293.66, 329.63].forEach((freq, i) => {
      const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq;
      const lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
      lfo.frequency.value = .07 + i * .025; lfoGain.gain.value = .03;
      const gain = ctx.createGain(); gain.gain.value = .045;
      lfo.connect(lfoGain); lfoGain.connect(gain.gain);
      osc.connect(gain).connect(masterGain);
      osc.start(); lfo.start();
      musicNodes.push(osc, lfo);
    });
  }
  function stopMusic() {
    musicNodes.forEach(n => { try { n.stop(); n.disconnect(); } catch (e) {} });
    try { masterGain && masterGain.disconnect(); } catch (e) {}
    musicNodes = []; masterGain = null;
  }
  document.getElementById('musicBtn').addEventListener('click', function () {
    musicOn = !musicOn; this.textContent = musicOn ? '🔊' : '🔇';
    musicOn ? startMusic() : stopMusic();
  });

  document.getElementById('themeBtn').addEventListener('click', function () {
    document.body.classList.toggle('dark');
    this.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  });

  /* ---------- confetti ---------- */
  function burstConfetti() {
    if (reduce) return;
    const colors = ['#e8a867', '#c98a4b', '#8b4a1f', '#f5e6d3', '#5a3a26', '#d9a066'];
    for (let i = 0; i < 90; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      const s = 6 + Math.random() * 7;
      p.style.width = s + 'px'; p.style.height = (s * .45) + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.setProperty('--dx', ((Math.random() - .5) * 200) + 'px');
      p.style.animationDuration = (2.4 + Math.random() * 2) + 's';
      p.style.animationDelay = (Math.random() * .5) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 5200);
    }
  }

  /* ---------- typing (supports highlighted phrases) ---------- */
  const parts1 = [
    { t: "i'm really sorry for " },
    { t: "raising my voice", hl: true },
    { t: ", I didn't mean it i had to speak loud as there were people around but that's no excuse for how it came across. and i'm sorry for calling you " },
    { t: "egoistic", hl: true },
    { t: ", it wasn't fair and it's not who you are. you're " },
    { t: "important to me", hl: true },
    { t: ", and i " },
    { t: "care about you", hl: true },
    { t: " more than i showed." }
  ];
  const parts2 = [
    { t: "next time i'll talk to you calmly, and i won't let a moment like that get bigger than " },
    { t: "us", hl: true },
    { t: " again. forgive me bonu, you matter to me more than anyone." }
  ];
  let typingToken = 0;
  function typeParts(el, segs, speed, onDone) {
    const token = ++typingToken;
    const cursor = document.createElement('span'); cursor.className = 'cursor';
    el.textContent = '';
    let si = 0, ci = 0, node = null;
    function newNode() {
      node = segs[si].hl ? document.createElement('span') : document.createTextNode('');
      if (segs[si].hl) node.className = 'hl';
      el.insertBefore(node, cursor);
    }
    el.appendChild(cursor); newNode();
    (function step() {
      if (token !== typingToken) return;
      if (si >= segs.length) { if (onDone) onDone(); return; }
      const seg = segs[si];
      if (ci < seg.t.length) {
        const ch = seg.t[ci++];
        if (seg.hl) node.textContent += ch; else node.nodeValue += ch;
        const pause = (ch === ',' || ch === ')' || ch === '.') ? 260 : 0;
        setTimeout(step, speed + pause);
      } else {
        si++; ci = 0;
        if (si < segs.length) newNode();
        setTimeout(step, speed);
      }
    })();
  }

  /* ---------- flip sequence ---------- */
  let flipped = false;
  function runBack() {
    const fill = document.getElementById('meterFill'), pct = document.getElementById('meterPct');
    const sig = document.getElementById('sig'), again = document.getElementById('againBtn');
    sig.classList.remove('show'); again.classList.remove('show');
    fill.style.transition = 'none'; fill.style.width = '0%'; void fill.offsetWidth;
    fill.style.transition = ''; fill.style.width = '100%';
    let p = 0;
    const iv = setInterval(() => { p += 4; if (p >= 100) { p = 100; clearInterval(iv); } pct.textContent = p + '%'; }, 90);
    document.getElementById('type2').textContent = '';
    typeParts(document.getElementById('type1'), parts1, 38, () => {
      setTimeout(() => {
        typeParts(document.getElementById('type2'), parts2, 34, () => {
          setTimeout(() => { sig.classList.add('show'); again.classList.add('show'); burstConfetti(); }, 300);
        });
      }, 500);
    });
  }
  function doFlip() {
    if (flipped) return;
    flipped = true;
    document.getElementById('cardInner').classList.add('flipped');
    playChime();
    setTimeout(runBack, 800);
  }
  document.getElementById('flipBtn').addEventListener('click', doFlip);
  document.getElementById('againBtn').addEventListener('click', () => { playChime(); runBack(); });
  setTimeout(doFlip, 6000);
</script>
</body>
